version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: api-wine-quality
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    restart: always

  etl:
    build:
      context: ..
      dockerfile: docker/Dockerfile.etl
    container_name: etl-wine-quality
    env_file:
      - ../.env
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: "no"

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    container_name: dashboard-wine-quality
    ports:
      - "8050:8050"
    env_file:
      - ../.env
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: always
